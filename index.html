<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kazi Ndogo - Online Jobs</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230B6E4F' width='192' height='192'/><text x='96' y='96' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>K</text></svg>">
    <meta name="theme-color" content="#0B6E4F">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #0B6E4F;
            --primary-dark: #084C38;
            --accent: #FF6B35;
            --text-dark: #2D3436;
            --text-light: #636E72;
            --bg-light: #F5F6FA;
            --bg-white: #FFFFFF;
            --border: #E1E8ED;
            --success: #27AE60;
            --danger: #E74C3C;
        }

        html, body { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); color: var(--text-dark); }
        body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

        .container { max-width: 1200px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--bg-light); }

        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .header p { font-size: 0.9rem; opacity: 0.9; }

        .main { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .content { display: none; }
        .content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--bg-white); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .card h3 { color: var(--primary); margin-bottom: 1rem; font-size: 1.2rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.95rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; transition: all 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,110,79,0.1); }
        textarea { resize: vertical; min-height: 80px; }

        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(11,110,79,0.3); }
        .btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-secondary:hover { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #229954; }
        .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-block { width: 100%; justify-content: center; }

        .nav { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .nav-btn { padding: 0.65rem 1.2rem; background: var(--bg-white); color: var(--text-dark); border: 2px solid var(--border); border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-weight: 500; font-size: 0.9rem; }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

        .task-item { background: var(--bg-white); padding: 1rem; border-left: 4px solid var(--primary); margin-bottom: 1rem; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .task-item.completed { opacity: 0.6; border-left-color: var(--success); }
        .task-item h4 { margin-bottom: 0.4rem; }
        .task-meta { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.75rem; }
        .task-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .user-banner { background: linear-gradient(135deg, var(--accent), #FF8A50); color: white; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .user-banner p { margin: 0; }
        .user-email { font-size: 0.85rem; opacity: 0.9; }

        .empty { text-align: center; padding: 2rem; color: var(--text-light); }
        .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }

        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; animation: slideIn 0.3s; border-left: 4px solid; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .alert-success { background: rgba(39,174,96,0.1); color: var(--success); border-left-color: var(--success); }
        .alert-error { background: rgba(231,76,60,0.1); color: var(--danger); border-left-color: var(--danger); }

        .loading { text-align: center; padding: 2rem; }
        .spinner { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 2rem; max-width: 90%; width: 100%; max-height: 90vh; overflow-y: auto; }

        .footer { background: var(--bg-white); padding: 1rem; border-top: 1px solid var(--border); text-align: center; color: var(--text-light); font-size: 0.85rem; }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.4rem; }
            .main { padding: 1rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 Kazi Ndogo</h1>
            <p>Kupata kazi online kwa rahisi</p>
        </div>

        <div class="main">
            <!-- Auth Section -->
            <div id="auth-content" class="content active">
                <div class="card" style="max-width: 500px; margin: 2rem auto;">
                    <h3>🔐 Ingia kwa Account</h3>
                    <div id="login-alerts"></div>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required placeholder="****">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Ingia</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                        Huna account? <a href="#" onclick="toggleAuth(event)" style="color: var(--primary); text-decoration: none; font-weight: 600;">Jisajili</a>
                    </p>
                </div>

                <div id="signup-card" class="card" style="max-width: 500px; margin: 2rem auto; display: none;">
                    <h3>✨ Jisajili</h3>
                    <div id="signup-alerts"></div>
                    <form id="signup-form">
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password (6+ characters)</label>
                            <input type="password" id="signup-password" required placeholder="****" minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Jisajili</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                        Una account? <a href="#" onclick="toggleAuth(event)" style="color: var(--primary); text-decoration: none; font-weight: 600;">Ingia</a>
                    </p>
                </div>
            </div>

            <!-- App Section -->
            <div id="app-content" class="content">
                <!-- User Banner -->
                <div class="user-banner">
                    <div>
                        <p>Karibu! 👋</p>
                        <p class="user-email" id="user-email"></p>
                    </div>
                    <button class="btn" style="background: rgba(255,255,255,0.3); color: white; border: none;" onclick="logout()">Logout</button>
                </div>

                <!-- Navigation -->
                <div class="nav">
                    <button class="nav-btn active" onclick="switchTab('tasks', this)">📋 Tasks</button>
                    <button class="nav-btn" onclick="switchTab('jobs', this)">💼 Jobs</button>
                    <button class="nav-btn" onclick="switchTab('activity', this)">📊 Activity</button>
                    <button class="nav-btn" onclick="switchTab('settings', this)">⚙️ Settings</button>
                </div>

                <!-- Tasks Tab -->
                <div id="tasks-tab" class="tab-content">
                    <div class="card">
                        <h3>➕ Ongeza Task Mpya</h3>
                        <form id="task-form">
                            <div class="form-group">
                                <label for="task-title">Task Title</label>
                                <input type="text" id="task-title" required placeholder="Task title...">
                            </div>
                            <div class="form-group">
                                <label for="task-desc">Description</label>
                                <textarea id="task-desc" placeholder="Task description..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Hifadhi Task</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3>📋 Tasks Zangu</h3>
                        <div id="tasks-list"></div>
                    </div>
                </div>

                <!-- Jobs Tab -->
                <div id="jobs-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>➕ Ongeza Job Mpya</h3>
                        <form id="job-form">
                            <div class="form-group">
                                <label for="job-title">Job Title</label>
                                <input type="text" id="job-title" required placeholder="Job title...">
                            </div>
                            <div class="form-group">
                                <label for="job-desc">Description</label>
                                <textarea id="job-desc" placeholder="Job description..."></textarea>
                            </div>
                            <div class="form-group">
                                <label for="job-budget">Budget</label>
                                <input type="text" id="job-budget" placeholder="Budget...">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Hifadhi Job</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3>💼 Jobs Zilizopo</h3>
                        <div id="jobs-list"></div>
                    </div>
                </div>

                <!-- Activity Tab -->
                <div id="activity-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>📊 Activity Log</h3>
                        <div id="activity-list"></div>
                    </div>
                </div>

                <!-- Settings Tab -->
                <div id="settings-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>⚙️ Settings</h3>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="notif-toggle" checked>
                                Push Notifications
                            </label>
                        </div>
                        <button class="btn btn-danger" onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Kazi Ndogo v2.0 © 2024 | Made with ❤️</p>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC-MRYHu852JhV_bGzvTcsQMFTLezmc4",
            authDomain: "home-online-jobs.firebaseapp.com",
            projectId: "home-online-jobs",
            storageBucket: "home-online-jobs.firebasestorage.app",
            messagingSenderId: "648276796909",
            appId: "1:648276796909:web:b2ed696b00f8fb31f33e4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showApp();
                document.getElementById('user-email').textContent = user.email;
                loadData();
            } else {
                currentUser = null;
                showAuth();
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showAlert('Login successful! 🎉', 'success', 'login-alerts');
            } catch (error) {
                showAlert('Error: ' + error.message, 'error', 'login-alerts');
            }
        });

        // Signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            if (password.length < 6) {
                showAlert('Password must be 6+ characters', 'error', 'signup-alerts');
                return;
            }

            try {
                await auth.createUserWithEmailAndPassword(email, password);
                showAlert('Account created! 🎉', 'success', 'signup-alerts');
                setTimeout(() => toggleAuth(null), 1500);
            } catch (error) {
                showAlert('Error: ' + error.message, 'error', 'signup-alerts');
            }
        });

        // Add Task
        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const desc = document.getElementById('task-desc').value;

            try {
                await db.collection('tasks').add({
                    userId: currentUser.uid,
                    title: title,
                    description: desc,
                    completed: false,
                    createdAt: new Date(),
                    email: currentUser.email
                });
                showAlert('Task added! ✅', 'success');
                document.getElementById('task-form').reset();
                loadTasks();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        });

        // Add Job
        document.getElementById('job-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('job-title').value;
            const desc = document.getElementById('job-desc').value;
            const budget = document.getElementById('job-budget').value;

            try {
                await db.collection('jobs').add({
                    userId: currentUser.uid,
                    title: title,
                    description: desc,
                    budget: budget,
                    createdAt: new Date(),
                    email: currentUser.email
                });
                showAlert('Job posted! 💼', 'success');
                document.getElementById('job-form').reset();
                loadJobs();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        });

        // Load Data
        async function loadData() {
            loadTasks();
            loadJobs();
            loadActivity();
        }

        async function loadTasks() {
            try {
                const snapshot = await db.collection('tasks')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();

                const list = document.getElementById('tasks-list');
                list.innerHTML = '';

                if (snapshot.empty) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><p>Hamna tasks</p></div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const task = doc.data();
                    const html = `
                        <div class="task-item ${task.completed ? 'completed' : ''}">
                            <h4>${task.title}</h4>
                            <p class="task-meta">${task.description || 'No description'}</p>
                            <div class="task-actions">
                                <button class="btn btn-success btn-small" onclick="completeTask('${doc.id}')">✅ Complete</button>
                                <button class="btn btn-danger btn-small" onclick="deleteTask('${doc.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        async function loadJobs() {
            try {
                const snapshot = await db.collection('jobs')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();

                const list = document.getElementById('jobs-list');
                list.innerHTML = '';

                if (snapshot.empty) {
                    list.innerHTML = '<div class="empty"><div class="empty-icon">💼</div><p>Hamna jobs</p></div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const job = doc.data();
                    const html = `
                        <div class="task-item">
                            <h4>${job.title}</h4>
                            <p class="task-meta">${job.description || 'No description'}</p>
                            <p style="font-weight: 600; color: var(--accent); margin-bottom: 0.75rem;">Budget: ${job.budget || 'TBD'}</p>
                            <div class="task-actions">
                                <button class="btn btn-danger btn-small" onclick="deleteJob('${doc.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            } catch (error) {
                console.error('Error loading jobs:', error);
            }
        }

        async function loadActivity() {
            try {
                const snapshot = await db.collection('activity')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .get();

                const list = document.getElementById('activity-list');
                list.innerHTML = '';

                if (snapshot.empty) {
                    list.innerHTML = '<div class="empty"><p>No activity</p></div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const act = doc.data();
                    const date = act.createdAt?.toDate?.().toLocaleDateString('sw-TZ');
                    const time = act.createdAt?.toDate?.().toLocaleTimeString('sw-TZ', {hour: '2-digit', minute: '2-digit'});
                    list.innerHTML += `
                        <div style="padding: 0.75rem; border-bottom: 1px solid var(--border);">
                            <p><strong>${act.action}</strong></p>
                            <p style="font-size: 0.85rem; color: var(--text-light);">${date} ${time}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading activity:', error);
            }
        }

        async function completeTask(id) {
            try {
                await db.collection('tasks').doc(id).update({completed: true});
                await db.collection('activity').add({
                    userId: currentUser.uid,
                    action: 'Completed a task',
                    createdAt: new Date()
                });
                loadTasks();
                showAlert('Task completed! 🎉', 'success');
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function deleteTask(id) {
            if (confirm('Delete this task?')) {
                try {
                    await db.collection('tasks').doc(id).delete();
                    loadTasks();
                    showAlert('Task deleted ✓', 'success');
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
        }

        async function deleteJob(id) {
            if (confirm('Delete this job?')) {
                try {
                    await db.collection('jobs').doc(id).delete();
                    loadJobs();
                    showAlert('Job deleted ✓', 'success');
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tab + '-tab').style.display = 'block';
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleAuth(e) {
            if (e) e.preventDefault();
            const login = document.querySelector('#login-form').closest('.card');
            const signup = document.getElementById('signup-card');
            
            if (login.style.display === 'none') {
                login.style.display = 'block';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'block';
            }
        }

        function showAuth() {
            document.getElementById('auth-content').classList.add('active');
            document.getElementById('app-content').classList.remove('active');
        }

        function showApp() {
            document.getElementById('auth-content').classList.remove('active');
            document.getElementById('app-content').classList.add('active');
        }

        function showAlert(msg, type, target = 'login-alerts') {
            const div = document.createElement('div');
            div.className = `alert alert-${type}`;
            div.textContent = msg;
            const container = document.getElementById(target) || document.querySelector('.main');
            container.insertBefore(div, container.firstChild);
            setTimeout(() => div.remove(), 3000);
        }

        function logout() {
            if (confirm('Logout?')) {
                auth.signOut();
            }
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }

        console.log('✅ Kazi Ndogo App Ready!');
    </script>
</body>
</html>
