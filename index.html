<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kazi Ndogo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230B6E4F' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>K</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230B6E4F' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>K</text></svg>">
    <meta name="theme-color" content="#0B6E4F">
    <meta name="description" content="Kazi Ndogo - Kupata kazi online kwa rahisi">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0B6E4F;
            --primary-dark: #084C38;
            --accent: #FF6B35;
            --accent-light: #FFE5D9;
            --text-dark: #2D3436;
            --text-light: #636E72;
            --bg-light: #F5F6FA;
            --bg-white: #FFFFFF;
            --border-color: #E1E8ED;
            --success: #27AE60;
            --warning: #F39C12;
            --danger: #E74C3C;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
        }

        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Main Content */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Cards */
        .card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 110, 79, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-white);
            color: var(--text-dark);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nav-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Tasks List */
        .task-item {
            background: var(--bg-white);
            padding: 1rem;
            border-left: 4px solid var(--primary);
            margin-bottom: 1rem;
            border-radius: 4px;
            box-shadow: var(--shadow);
        }

        .task-item.completed {
            opacity: 0.7;
            border-left-color: var(--success);
        }

        .task-item h4 {
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .task-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.75rem;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Loading & Status */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .alert-warning {
            background: rgba(243, 156, 18, 0.1);
            color: var(--warning);
            border-left: 4px solid var(--warning);
        }

        /* Footer */
        .footer {
            background: var(--bg-white);
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.4rem;
            }

            .main {
                padding: 1rem;
            }

            .card {
                padding: 1rem;
            }

            .nav {
                gap: 0.5rem;
            }

            .nav-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        /* User Info */
        .user-info {
            background: var(--accent-light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info p {
            margin: 0;
            font-weight: 500;
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 Kazi Ndogo</h1>
            <p>Kupata kazi online kwa rahisi</p>
        </div>

        <div class="main">
            <!-- Alerts -->
            <div id="alerts"></div>

            <!-- Loading -->
            <div id="loading" style="display: none;">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Inakamatia...</p>
                </div>
            </div>

            <!-- Content Sections -->
            <div id="auth-section" class="content-section active">
                <div class="card" style="max-width: 500px; margin: 3rem auto;">
                    <h3>🔐 Ingia kwa Account</h3>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required placeholder="****">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Ingia</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                        Huna account? <a href="#" onclick="toggleSignup()" style="color: var(--primary); text-decoration: none; font-weight: 600;">Jisajili</a>
                    </p>
                </div>

                <div id="signup-card" class="card" style="max-width: 500px; margin: 3rem auto; display: none;">
                    <h3>✨ Jisajili</h3>
                    <form id="signup-form">
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" required placeholder="****">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Jisajili</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                        Una account? <a href="#" onclick="toggleSignup()" style="color: var(--primary); text-decoration: none; font-weight: 600;">Ingia</a>
                    </p>
                </div>
            </div>

            <div id="app-section" class="content-section">
                <!-- Navigation -->
                <div class="nav">
                    <button class="nav-btn active" onclick="switchTab('tasks')">📋 Tasks</button>
                    <button class="nav-btn" onclick="switchTab('jobs')">💼 Jobs</button>
                    <button class="nav-btn" onclick="switchTab('activity')">📊 Activity</button>
                    <button class="nav-btn" onclick="switchTab('settings')">⚙️ Settings</button>
                </div>

                <!-- User Info -->
                <div class="user-info">
                    <div>
                        <p>Welcome! 👋</p>
                        <p class="user-email" id="user-email"></p>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="logout()">Logout</button>
                </div>

                <!-- Tasks Tab -->
                <div id="tasks-tab" class="tab-content">
                    <div class="card">
                        <h3>➕ Ongeza Task Mpya</h3>
                        <form id="task-form">
                            <div class="form-group">
                                <label for="task-title">Task Title</label>
                                <input type="text" id="task-title" required placeholder="Andika title ya task">
                            </div>
                            <div class="form-group">
                                <label for="task-description">Description</label>
                                <textarea id="task-description" placeholder="Maelezo ya task"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Hifadhi Task</button>
                        </form>
                    </div>

                    <div class="card">
                        <h3>📋 Tasks Zangu</h3>
                        <div id="tasks-list"></div>
                    </div>
                </div>

                <!-- Jobs Tab -->
                <div id="jobs-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>💼 Jobs Zilizopo</h3>
                        <div id="jobs-list"></div>
                    </div>
                </div>

                <!-- Activity Tab -->
                <div id="activity-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>📊 Activity Log</h3>
                        <div id="activity-list"></div>
                    </div>
                </div>

                <!-- Settings Tab -->
                <div id="settings-tab" class="tab-content" style="display: none;">
                    <div class="card">
                        <h3>⚙️ Settings</h3>
                        <div class="form-group">
                            <label for="notification-toggle">
                                <input type="checkbox" id="notification-toggle" checked>
                                Push Notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="dark-mode-toggle">
                                <input type="checkbox" id="dark-mode-toggle">
                                Dark Mode (Coming Soon)
                            </label>
                        </div>
                        <button class="btn btn-danger" onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Kazi Ndogo v1.0 © 2024 | Made with ❤️</p>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC-MRYHu852JhV_bGzvTcsQMFTLezmc4",
            authDomain: "home-online-jobs.firebaseapp.com",
            projectId: "home-online-jobs",
            storageBucket: "home-online-jobs.firebasestorage.app",
            messagingSenderId: "648276796909",
            appId: "1:648276796909:web:b2ed696b00f8fb31f33e4",
            measurementId: "G-BM34D1981S"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('Service Worker registered');
            }).catch(err => console.log('Service Worker registration failed:', err));
        }

        // Global State
        let currentUser = null;
        let tasks = [];

        // Authentication State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showAppSection();
                loadUserData();
                document.getElementById('user-email').textContent = user.email;
            } else {
                currentUser = null;
                showAuthSection();
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                showLoading(true);
                await auth.signInWithEmailAndPassword(email, password);
                showAlert('Login successful! 🎉', 'success');
            } catch (error) {
                showAlert('Login failed: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // Signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                showLoading(true);
                await auth.createUserWithEmailAndPassword(email, password);
                showAlert('Account created! Welcome 🎉', 'success');
                toggleSignup();
            } catch (error) {
                showAlert('Signup failed: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // Add Task
        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;

            try {
                showLoading(true);
                await db.collection('tasks').add({
                    userId: currentUser.uid,
                    title: title,
                    description: description,
                    completed: false,
                    createdAt: new Date(),
                    email: currentUser.email
                });
                showAlert('Task added successfully! ✅', 'success');
                document.getElementById('task-form').reset();
                loadTasks();
            } catch (error) {
                showAlert('Error adding task: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // Load User Tasks
        async function loadUserData() {
            loadTasks();
            loadActivity();
        }

        async function loadTasks() {
            try {
                showLoading(true);
                const snapshot = await db.collection('tasks')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .get();

                tasks = [];
                const tasksList = document.getElementById('tasks-list');
                tasksList.innerHTML = '';

                if (snapshot.empty) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <h3>Hamna Tasks</h3>
                            <p>Anza kwa kuongeza task mpya</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach(doc => {
                    const task = doc.data();
                    task.id = doc.id;
                    tasks.push(task);

                    const html = `
                        <div class="task-item ${task.completed ? 'completed' : ''}">
                            <h4>${task.title}</h4>
                            <p class="task-meta">${task.description}</p>
                            <div class="task-actions">
                                <button class="btn btn-success btn-small" onclick="completeTask('${task.id}')">✅ Done</button>
                                <button class="btn btn-danger btn-small" onclick="deleteTask('${task.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                    tasksList.innerHTML += html;
                });
            } catch (error) {
                showAlert('Error loading tasks: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function completeTask(taskId) {
            try {
                await db.collection('tasks').doc(taskId).update({
                    completed: true
                });
                loadTasks();
                showAlert('Task completed! 🎉', 'success');
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function deleteTask(taskId) {
            if (confirm('Delete this task?')) {
                try {
                    await db.collection('tasks').doc(taskId).delete();
                    loadTasks();
                    showAlert('Task deleted ✓', 'success');
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
        }

        async function loadActivity() {
            try {
                const snapshot = await db.collection('activity')
                    .where('userId', '==', currentUser.uid)
                    .orderBy('createdAt', 'desc')
                    .limit(10)
                    .get();

                const activityList = document.getElementById('activity-list');
                activityList.innerHTML = '';

                if (snapshot.empty) {
                    activityList.innerHTML = '<p style="text-align: center; color: var(--text-light);">No activity yet</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const activity = doc.data();
                    const date = activity.createdAt?.toDate?.().toLocaleDateString('sw-TZ');
                    activityList.innerHTML += `
                        <div style="padding: 0.75rem; border-bottom: 1px solid var(--border-color);">
                            <p><strong>${activity.action}</strong></p>
                            <p style="font-size: 0.85rem; color: var(--text-light);">${date}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.log('Activity load error:', error);
            }
        }

        // Navigation
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tab + '-tab').style.display = 'block';

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'activity') loadActivity();
        }

        // UI Functions
        function showAuthSection() {
            document.getElementById('auth-section').classList.add('active');
            document.getElementById('app-section').classList.remove('active');
        }

        function showAppSection() {
            document.getElementById('auth-section').classList.remove('active');
            document.getElementById('app-section').classList.add('active');
        }

        function toggleSignup() {
            const loginCard = document.querySelector('#login-form').closest('.card');
            const signupCard = document.getElementById('signup-card');
            
            if (loginCard.style.display === 'none') {
                loginCard.style.display = 'block';
                signupCard.style.display = 'none';
            } else {
                loginCard.style.display = 'none';
                signupCard.style.display = 'block';
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showAlert(message, type = 'info') {
            const alertsDiv = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertsDiv.appendChild(alert);

            setTimeout(() => alert.remove(), 3000);
        }

        function logout() {
            if (confirm('Logout?')) {
                auth.signOut();
            }
        }

        // Initialize
        console.log('Kazi Ndogo App Loaded ✅');
    </script>
</body>
</html>
